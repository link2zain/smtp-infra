x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

networks:
  db-net:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sengrid}
      POSTGRES_USER: ${POSTGRES_USER:-sengrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    # Bound to the VM's private IP (not 127.0.0.1) so smtp-app and smtp-db-replica can reach it
    # over the 10.10.1.0/24 network. Actual access control is the host firewall (see setup.sh),
    # not this binding — Postgres itself still requires auth either way.
    ports:
      - "10.10.1.5:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    networks:
      - db-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sengrid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  redis:
    image: redis:7-alpine
    entrypoint: ["/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "10.10.1.5:6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf.template:/usr/local/etc/redis/redis.conf.template:ro
      - ./redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    networks:
      - db-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres-data:
  redis-data:
