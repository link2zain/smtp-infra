# Identical on every node (smtp-mail-1/2/3) -- classic_config peer discovery means each node
# tries to auto-cluster with the other two named nodes on boot, no manual `join_cluster` needed
# (verified locally: a fresh 3-node cluster forms on its own within seconds of all 3 starting).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@smtp-mail-1
cluster_formation.classic_config.nodes.2 = rabbit@smtp-mail-2
cluster_formation.classic_config.nodes.3 = rabbit@smtp-mail-3

# If the cluster splits, the minority side stops accepting operations rather than both sides
# silently diverging -- appropriate for a 3-node cluster where "minority" unambiguously means
# "the 1 node that got cut off", not a coin flip.
cluster_partition_handling = pause_minority

queue_master_locator = min-masters
loopback_users.guest = false
