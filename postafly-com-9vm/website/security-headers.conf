# Security headers for the Postafly console and API.
#
# Installed as /etc/nginx/snippets/postafly-security-headers.conf (by setup.sh and enable-https.sh) and pulled into the
# server block with:   include /etc/nginx/snippets/postafly-security-headers.conf;
# It must sit at server level. nginx drops inherited add_header lines in any location that has its own add_header, and
# none of ours do, so every answer (pages, assets, /api, errors) carries the same set.
#
# Audit finding S-03: the public site sent none of these and announced its nginx version.
# Rollout and rollback steps: docs/SECURITY_HEADERS.md

# The backend already sets these two on /api, /track and /unsubscribe answers. Hiding its copy means the browser sees
# exactly one of each, whichever side produced it.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;

# The browser must not guess a file's type (a stored upload read as a script), and nobody may put the site in a frame.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# Links from the console to other sites send only our address, never the page path or its query string.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Features the console never uses are switched off, so a compromised page cannot ask for them.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# HTTPS only. Browsers REMEMBER this, so it starts at five minutes and is raised in steps once every page has been seen
# working (see docs/SECURITY_HEADERS.md). includeSubDomains and preload are deliberately not set: other names under the
# domain (mail hosts, the picture host) have not been checked.
add_header Strict-Transport-Security "max-age=300" always;

# Content Security Policy: which places the page may load from. The point is that a script the page did not ship cannot run,
# including one that gets in through stored template content (audit S-01): no inline scripts, no inline event handlers, no
# javascript: links, no scripts from anywhere but this site and Google's sign-in.
#   script-src   this site, and Google's sign-in button script
#   style-src    this site, Google Fonts, Google's button style, and inline style attributes (React and the email editor use them)
#   img-src      https pictures from anywhere, because the email preview shows the pictures a template links to
#   frame-src    Google's sign-in frame (the sandboxed email preview frames are built in the page and need no allowance)
#   object-src, base-uri, form-action, frame-ancestors   closed off
#
# It starts in REPORT-ONLY mode: the browser reports what it would have blocked in its console and blocks nothing. After
# every page, including Google sign-in, has been used with no report, switch to enforcing by commenting out the
# Report-Only line and removing the "#" from the line below it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
#add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
