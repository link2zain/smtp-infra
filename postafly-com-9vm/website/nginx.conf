server {
    listen 80;
    server_name _;

    root /opt/sengrid/frontend/dist;
    index index.html;

    # Sending mail can carry attachments (up to 7 MB, which is about 10 MB once encoded), and nginx's default request
    # limit is 1 MB. An exact match, so only this path gets the bigger allowance.
    location = /api/v1/mail/send {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Links inside emails we send: open pixel, click redirect and the unsubscribe page. They are served by the
    # backend, not the website; without these two blocks they would answer with the website's home page.
    location /track/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /unsubscribe/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Defense in depth alongside ufw: only the monitoring VM (Prometheus) may read actuator.
        allow 193.168.10.88;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        try_files $uri /index.html;
    }
}
