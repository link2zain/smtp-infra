server {
    listen 80;
    server_name _;

    root /opt/sengrid/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Defense in depth alongside ufw: only the monitoring VM (Prometheus) may read actuator.
        allow 193.168.10.88;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        try_files $uri /index.html;
    }
}
