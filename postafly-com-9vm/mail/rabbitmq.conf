# Identical on every node (mail-1/2/3) -- classic_config peer discovery means each node tries to
# auto-cluster with the other two named nodes on boot, no manual `join_cluster` needed.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@mail-1
cluster_formation.classic_config.nodes.2 = rabbit@mail-2
cluster_formation.classic_config.nodes.3 = rabbit@mail-3

# If the cluster splits, the minority side stops accepting operations rather than both sides
# silently diverging -- appropriate for a 3-node cluster.
cluster_partition_handling = pause_minority

queue_master_locator = min-masters
loopback_users.guest = false
